name: Gerar APK - Vídeos+imagens

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Android SDK 37
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37"

      - name: Extrair projeto
        run: |
          unzip -q VideosImagens-GitHub-Pronto-v2.zip
          test -f VideosImagens-GitHub-Pronto-v2/settings.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Gerar APK
        working-directory: VideosImagens-GitHub-Pronto-v2
        run: gradle assembleDebug --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Videos-imagens-APK
          path: VideosImagens-GitHub-Pronto-v2/app/build/outputs/apk/debug/app-debug.apk
